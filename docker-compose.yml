services:
  postgres:
    image: postgres:16-alpine
    container_name: taela-ai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: taela_ai
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - taela-ai-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d taela_ai"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  taela-ai-postgres-data:
