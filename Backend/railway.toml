# This service is just the API — Postgres is a separate Railway-managed
# database (see .railway/railway.ts), wired in via DATABASE_URL. In the
# Railway dashboard for this service, set JWT_SECRET, ADMIN_TOKEN, and
# ALLOWED_ORIGINS (DATABASE_URL is set automatically by the IaC graph).

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/healthz"
healthcheckTimeout = 100
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
